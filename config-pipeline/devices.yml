devices:
  - hostname: Router1
    type: router
    interfaces:
      - name: GigabitEthernet0/0/0
        description: Link to Router2
        ip: 10.0.12.1/30
      - name: GigabitEthernet0/0/1
        description: Link to Router3
        ip: 10.0.13.1/30
      - name: Loopback1
        ip: 10.1.1.1/32
      - name: Loopback2
        ip: 10.1.2.1/32
      - name: Loopback3
        ip: 10.1.3.1/32

  - hostname: Router2
    type: router
    interfaces:
      - name: GigabitEthernet0/0/0
        description: Link to Router1
        ip: 10.0.12.2/30
      - name: GigabitEthernet0/0/1
        description: Link to Router3
        ip: 10.0.23.1/30
      - name: GigabitEthernet0/0/2
        description: Trunk to Switch1
      - name: GigabitEthernet0/0/2.10
        vlan: 10
        ip: 192.168.10.1/24
      - name: GigabitEthernet0/0/2.20
        vlan: 20
        ip: 192.168.20.1/24
      - name: GigabitEthernet0/0/2.30
        vlan: 30
        ip: 192.168.30.2/24
      - name: Loopback1
        ip: 10.2.1.1/32
      - name: Loopback2
        ip: 10.2.2.1/32
      - name: Loopback3
        ip: 10.2.3.1/32

  - hostname: Router3
    type: router
    interfaces:
      - name: GigabitEthernet0/0/0
        description: Link to Router1
        ip: 10.0.13.2/30
      - name: GigabitEthernet0/0/1
        description: Link to Router2
        ip: 10.0.23.2/30
      - name: Loopback1
        ip: 10.3.1.1/32
      - name: Loopback2
        ip: 10.3.2.1/32
      - name: Loopback3
        ip: 10.3.3.1/32

  - hostname: Switch1
    type: switch
    interfaces:
      - name: GigabitEthernet1/0/1
        description: Trunk to Router2
        mode: trunk
      - name: GigabitEthernet1/0/24
        description: Trunk to Switch2
        mode: trunk
      - name: GigabitEthernet1/0/2
        description: DEVASC Connection
        mode: access
        vlan: 30
      - name: Vlan30
        ip: 192.168.30.11/24
      - name: Loopback1
        description: CNIT381 Hanson Final Project
        ip: 10.4.1.1/32

  - hostname: Switch2
    type: switch
    interfaces:
      - name: GigabitEthernet1/0/24
        description: Trunk to Switch1
        mode: trunk
      - name: Vlan30
        ip: 192.168.30.12/24
